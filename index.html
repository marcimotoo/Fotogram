<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotogram</title>
    <link rel="shortcut icon" href="assets/icons/fotogram_icon.svg" type="image/x-icon" />
    <link rel="stylesheet" href="./style/components.css" />
    <link rel="stylesheet" href="./style/variables.css" />
    <link rel="stylesheet" href="./style/font.css" />
    <link rel="stylesheet" href="./style/reset.css" />
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <div class="blur_bg"></div>
    <header>
      <div class="header">
        <img src="./assets/icons/fotogram_text_logo.svg" alt="" />
      </div>
    </header>
    <main>
      <h1>Your personal photo album</h1>
      <section id="foto_section">
        <div class="big_foto_mode">
          <div class="img_info">
            <p>Alaska-810433_1280</p>
            <button class="close_button"><img src="./assets/icons/close.svg" alt="" /></button>
          </div>
          <img src="./assets/images/buitymounten.jpg" alt="" />
          <div class="back_forward">
            <button class="arrow_button"><img src="./assets/icons/left.svg" alt="" /></button>
            <p>1/12</p>
            <button class="arrow_button"><img src="./assets/icons/right.svg" alt="" /></button>
          </div>
        </div>
        <img onclick="openImgWindow()" src="./assets/images/buitymounten.jpg" alt="" />
        <img onclick="openImgWindow()" src="./assets/images/cityanime.jpg" alt="" />
        <img onclick="openImgWindow()" src="./assets/images/clouds.png" alt="" />
        <img onclick="openImgWindow()" src="./assets/images/birdtree.jpg" alt="" />
        <img onclick="openImgWindow()" src="./assets/images/earth.jpg" alt="" />
        <img onclick="openImgWindow()" src="./assets/images/snowwater.jpg" alt="" />
        <img onclick="openImgWindow()" src="./assets/images/waterbird.jpg" alt="" />
        <img onclick="openImgWindow()" src="./assets/images/night.jpg" alt="" />
        <img onclick="openImgWindow()" src="./assets/images/bird.jpg" alt="" />
        <img onclick="openImgWindow()" src="./assets/images/snowleopard.jpg" alt="" />
        <img onclick="openImgWindow()" src="./assets/images/mounten.jpg" alt="" />
        <img onclick="openImgWindow()" src="./assets/images/whitetree.jpg" alt="" />
      </section>
    </main>
    <footer>
      <section class="da_logo">
        <img src="./assets/icons/DA_logo.svg" alt="Logo and text from the Developer Akademie" />
        <p>© 2023 Developer Akademie GmbH</p>
      </section>
    </footer>
  </body>
  <script src="./script/script.js" defer></script>
</html>
